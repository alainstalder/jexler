plugins {
  id 'groovy'
  id 'eclipse'
  id 'war'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
    vendor = JvmVendorSpec.AZUL // Zulu
    implementation = JvmImplementation.VENDOR_SPECIFIC
  }
}

repositories {
  mavenCentral()
  mavenLocal()
}

version = '5.0.0'

//project.group = 'ch.grengine.jexler'

description =
        'Jexler is a simple relaxed Groovy framework for starting/stopping' +
        ' Groovy scripts as services and enabling them to react to events' +
        ' of their choice - great for prototyping and useful for automating.'

project.ext {
  pkg = 'war'
}

ext {
  groovyVersion='6.0.0'
  spockVersion='2.5-groovy-6.0'

  grengineVersion='4.1.1'

  slf4jVersion='2.0.20'
  logbackVersion='1.6.6'
  quartzVersion='2.5.2'

  servletVersion='6.1.0'
  jspVersion='4.0.0'
  elVersion='6.0.1'
  jstlApiVersion='3.0.2'
  jstlVersion='3.0.1'
  jettyVersion='12.1.14'

  // aligned with the JUnit BOM used by Spock
  junitVersion='5.14.4'
}

war {
  manifest {
    attributes 'Implementation-Title': 'jexler', 'Implementation-Version': version
  }
}

dependencies {
  implementation "org.apache.groovy:groovy:$groovyVersion"
  implementation "org.apache.groovy:groovy-grape-ivy:$groovyVersion"
  implementation "ch.grengine:grengine:$grengineVersion"
  implementation "org.slf4j:slf4j-api:$slf4jVersion"
  implementation "ch.qos.logback:logback-classic:$logbackVersion"
  implementation "org.quartz-scheduler:quartz:$quartzVersion"

  runtimeOnly "jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:$jstlApiVersion"
  runtimeOnly "org.glassfish.web:jakarta.servlet.jsp.jstl:$jstlVersion"

  providedCompile "jakarta.servlet:jakarta.servlet-api:$servletVersion"
  providedCompile "jakarta.servlet.jsp:jakarta.servlet.jsp-api:$jspVersion"
  providedCompile "jakarta.el:jakarta.el-api:$elVersion"

  // Embedded Jetty with JSP support (for "demo")
  testImplementation "org.eclipse.jetty:jetty-server:$jettyVersion"
  testImplementation "org.eclipse.jetty.ee11:jetty-ee11-webapp:$jettyVersion"
  testImplementation "org.eclipse.jetty.ee11:jetty-ee11-annotations:$jettyVersion"
  testImplementation "org.eclipse.jetty.ee11:jetty-ee11-apache-jsp:$jettyVersion"

  // Unit tests
  testImplementation "org.spockframework:spock-core:$spockVersion"
  testRuntimeOnly platform("org.junit:junit-bom:$junitVersion")
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  testRuntimeOnly files('src/main/resources')
}

// Using CodeMirror from zip file so that GitHub
// does not label jexler as mainly JavaScript/HTML
tasks.register('removeCmDir', Delete) {
  delete layout.projectDirectory.dir('src/main/webapp/cm')
}
tasks.register('unzipCmDir', Copy) {
  dependsOn(removeCmDir)
  from zipTree(layout.projectDirectory.dir('src/main/cm/cm.zip'))
  into layout.projectDirectory.dir('src/main/webapp')
}
compileGroovy {
  dependsOn(removeCmDir, unzipCmDir)
}

test {
  //testLogging.showStandardStreams = true
  useJUnitPlatform {
    excludeTags "slow"
    excludeTags "demo"
  }
  /*afterTest { desc, result ->
    println "Executing test ${desc.name} [${desc.className}] with result: ${result.resultType}"
  }*/
}

tasks.register('slowTests', Test) {
  dependsOn 'test'
  testClassesDirs = testing.suites.test.sources.output.classesDirs
  classpath = testing.suites.test.sources.runtimeClasspath

  //testLogging.showStandardStreams = true
  useJUnitPlatform {
    includeTags "slow"
  }
}

tasks.register('demo', Test) {
  testClassesDirs = testing.suites.test.sources.output.classesDirs
  classpath = testing.suites.test.sources.runtimeClasspath

  testLogging.showStandardStreams = true
  useJUnitPlatform {
    includeTags "demo"
  }
}
